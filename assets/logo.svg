<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prismAperture" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="irisBacking" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1145"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Film Spool / Neural Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#irisBacking)"/>
  <circle cx="32" cy="32" r="28" stroke="url(#prismAperture)" stroke-width="2" filter="url(#neonBloom)"/>

  <!-- Shutter Blades (Aperture Geometry) -->
  <path d="M32 8 L44 26 L20 26 Z" fill="rgba(139, 92, 246, 0.25)" stroke="#8b5cf6" stroke-width="1.2"/>
  <path d="M56 32 L38 44 L38 20 Z" fill="rgba(236, 72, 153, 0.25)" stroke="#ec4899" stroke-width="1.2"/>
  <path d="M32 56 L20 38 L44 38 Z" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1.2"/>
  <path d="M8 32 L26 20 L26 44 Z" fill="rgba(139, 92, 246, 0.25)" stroke="#8b5cf6" stroke-width="1.2"/>

  <!-- Central Neural Core -->
  <circle cx="32" cy="32" r="9" fill="#090c16" stroke="url(#prismAperture)" stroke-width="2"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="url(#neonBloom)"/>

  <!-- Peripheral Film Perforations -->
  <rect x="30" y="2" width="4" height="3" rx="1" fill="#8b5cf6"/>
  <rect x="30" y="59" width="4" height="3" rx="1" fill="#06b6d4"/>
  <rect x="2" y="30" width="3" height="4" rx="1" fill="#8b5cf6"/>
  <rect x="59" y="30" width="3" height="4" rx="1" fill="#ec4899"/>
</svg>