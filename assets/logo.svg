<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldBrain" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Hemisphere Neural Circuit -->
  <path d="M22 10C17 10 13 13 13 18C13 20 14 22 15 23C13.5 25 13 27 13 29C13 33 16 36 20 37C21 37.3 22 37.5 22 38" stroke="url(#goldBrain)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#goldGlow)"/>
  <path d="M17 18C17 15 19 13 22 13" stroke="url(#goldBrain)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M16 26C18 26 20 25 22 25" stroke="url(#goldBrain)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 32C18 32 20 33 22 33" stroke="url(#goldBrain)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="17" cy="18" r="1.8" fill="#FFE082"/>
  <circle cx="16" cy="26" r="1.8" fill="#FFE082"/>
  <circle cx="16" cy="32" r="1.8" fill="#FFE082"/>

  <!-- Right Hemisphere Neural Circuit -->
  <path d="M26 10C31 10 35 13 35 18C35 20 34 22 33 23C34.5 25 35 27 35 29C35 33 32 36 28 37C27 37.3 26 37.5 26 38" stroke="url(#goldBrain)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#goldGlow)"/>
  <path d="M31 18C31 15 29 13 26 13" stroke="url(#goldBrain)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M32 26C30 26 28 25 26 25" stroke="url(#goldBrain)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 32C30 32 28 33 26 33" stroke="url(#goldBrain)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="31" cy="18" r="1.8" fill="#FFE082"/>
  <circle cx="32" cy="26" r="1.8" fill="#FFE082"/>
  <circle cx="32" cy="32" r="1.8" fill="#FFE082"/>

  <!-- Central Synapse Axis -->
  <line x1="24" y1="12" x2="24" y2="36" stroke="url(#goldBrain)" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="24" cy="12" r="2" fill="#FFE082"/>
  <circle cx="24" cy="24" r="2.2" fill="#FFFFFF" filter="url(#goldGlow)"/>
  <circle cx="24" cy="36" r="2" fill="#FFE082"/>
</svg>