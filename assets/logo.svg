<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Luxury Cinema Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="50%" stop-color="#0F091E"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>

    <!-- Metallic Cinema Gold Gradient -->
    <linearGradient id="filmGold" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Neon Cyan & Magenta Flares -->
    <linearGradient id="cyanMagenta" x1="20" y1="64" x2="108" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="centerFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#subtleDrop)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="url(#cyanMagenta)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Optical Iris Center Glow -->
  <circle cx="64" cy="64" r="38" fill="url(#centerFlare)"/>

  <!-- Outer Film Reel Perforated Rim -->
  <circle cx="64" cy="64" r="42" stroke="url(#filmGold)" stroke-width="2" stroke-dasharray="5 3.5" stroke-opacity="0.75"/>
  <circle cx="64" cy="64" r="35" stroke="url(#filmGold)" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Cinema Camera Aperture Blades (8-blade geometric iris) -->
  <g stroke="url(#filmGold)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowFilter)">
    <!-- Blade 1 -->
    <path d="M64 26 L78 50 L64 56 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 2 -->
    <path d="M91 37 L85 64 L74 58 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 3 -->
    <path d="M102 64 L78 78 L72 67 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 4 -->
    <path d="M91 91 L64 85 L67 74 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 5 -->
    <path d="M64 102 L50 78 L61 72 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 6 -->
    <path d="M37 91 L43 64 L54 70 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 7 -->
    <path d="M26 64 L50 50 L56 61 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
    <!-- Blade 8 -->
    <path d="M37 37 L64 43 L61 54 Z" fill="url(#filmGold)" fill-opacity="0.25"/>
  </g>

  <!-- Central Lens Pupil / Optical Core -->
  <circle cx="64" cy="64" r="14" fill="#0F091E" stroke="url(#filmGold)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="8" fill="url(#filmGold)"/>
  <circle cx="61" cy="61" r="3" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Cinema Neural Beam / Play Triangle Inset -->
  <polygon points="61,57 71,64 61,71" fill="#0F091E"/>

  <!-- Precision Corner Film Notches -->
  <circle cx="20" cy="20" r="3" fill="url(#filmGold)" fill-opacity="0.6"/>
  <circle cx="108" cy="20" r="3" fill="url(#filmGold)" fill-opacity="0.6"/>
  <circle cx="20" cy="108" r="3" fill="url(#filmGold)" fill-opacity="0.6"/>
  <circle cx="108" cy="108" r="3" fill="url(#filmGold)" fill-opacity="0.6"/>
</svg>
