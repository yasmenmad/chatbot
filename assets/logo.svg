<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Personalized Sunset Gradient -->
    <linearGradient id="yasmenBg" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="70%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Golden Monogram Gradient -->
    <linearGradient id="goldMonogram" x1="32" y1="28" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <radialGradient id="monogramGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4C1D95" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#yasmenBg)" filter="url(#iconShadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#monogramGlow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" ry="25.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Optical Cinema Iris Circle -->
  <circle cx="64" cy="62" r="32" stroke="url(#goldMonogram)" stroke-width="3" stroke-dasharray="6 3" stroke-opacity="0.7"/>

  <!-- Personalized Monogram "Y" Intertwined with Cinema Aperture -->
  <!-- Left diagonal branch of Y -->
  <path d="M42 38L64 64" stroke="url(#goldMonogram)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Right diagonal branch of Y -->
  <path d="M86 38L64 64" stroke="url(#goldMonogram)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Central vertical stem of Y -->
  <path d="M64 64V88" stroke="url(#goldMonogram)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Cinema Reel Notches / Star Accents -->
  <circle cx="42" cy="38" r="4.5" fill="#FFFFFF"/>
  <circle cx="86" cy="38" r="4.5" fill="#FFFFFF"/>
  <circle cx="64" cy="88" r="4.5" fill="#FDE68A"/>

  <!-- Center Playback Lens Spark -->
  <circle cx="64" cy="64" r="5" fill="#FFFFFF"/>
</svg>
